# Example Strategy Configuration
name: "Mean Reversion Strategy"
description: "A strategy that buys oversold assets and sells overbought assets."
initial_capital: 100000
monthly_addition: 0
rebalancing: false
screener:
  conditions:
    - metric: "RSI"
      operator: "<"
      value: 30
    - metric: "RSI"
      operator: ">"
      value: 70
parameters:
  lookback_period: 14
  oversold_threshold: 30
  overbought_threshold: 70
  position_size: 0.1
rules:
  - condition: "RSI < oversold_threshold"
    action: "Buy"
  - condition: "RSI > overbought_threshold"
    action: "Sell"